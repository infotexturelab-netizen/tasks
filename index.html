<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="משימות">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>המשימות שלי</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#e9e4da">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Varela+Round&display=swap">
<style>
/* Layout: a spiral notebook on a desk. Topic index-tabs stick out of the page's right edge; tasks sit on ruled lines with a pink margin; composer pinned to the bottom. Single paper look on purpose (light in both themes). */
:root{
  color-scheme:light;
  --desk:#e9e4da; --paper:#fffdf8; --ink:#2b2a33; --muted:#8a8578; --rule:#cfe0ee; --margin:#f2a7b7;
  --pink:#e9768f; --accent:#d9546f; --wire:#b9a37a; --shadow:0 12px 30px rgba(70,55,30,.18);
  --font-hand:"Amatic SC","Varela Round",cursive; --font-body:"Varela Round","Heebo",system-ui,-apple-system,Arial,sans-serif;
  --row:52px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--desk);color:var(--ink);font-family:var(--font-body);font-size:16px;direction:rtl;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(rgba(120,100,70,.07) 1px,transparent 1.2px);background-size:14px 14px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--desk)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.desk{max-width:680px;margin:0 auto;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px));padding-block:14px 190px}
.book{display:grid;grid-template-columns:62px minmax(0,1fr);align-items:start}

/* index tabs (right side) */
.sidetabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);display:flex;flex-direction:column;gap:6px;padding-top:4px;z-index:3}
.tab{--c:#ecebe6;position:relative;border:0;background:var(--c);border-radius:0 12px 12px 0;padding:12px 6px;margin-left:-2px;min-height:58px;font-size:.82rem;line-height:1.15;text-align:center;box-shadow:2px 2px 0 rgba(0,0,0,.06);transition:transform .12s;overflow-wrap:anywhere}
.tab .n{display:block;font-size:.7rem;opacity:.6;margin-top:3px}
.tab[aria-pressed="true"]{background:var(--paper);margin-left:-8px;padding-left:12px;font-weight:700;box-shadow:2px 2px 0 rgba(0,0,0,.05)}
.tab[aria-pressed="true"]::before{content:"";position:absolute;inset:6px auto 6px 0;width:4px;border-radius:4px;background:var(--c)}
.tab.drop{transform:translateX(6px) scale(1.06);outline:2px dashed var(--accent)}
.tab.tool{background:transparent;box-shadow:none;border:1.5px dashed #bdb5a5;min-height:40px;color:var(--muted);font-size:1.1rem;padding:6px}

/* paper */
.page{position:relative;background:var(--paper);border-radius:6px 6px 10px 10px;box-shadow:var(--shadow);padding-top:26px;min-height:70vh;z-index:2}
.rings{position:absolute;top:-10px;inset-inline:14px;height:26px;
  background:
   radial-gradient(circle at 50% 75%,#5b5448 0 3.5px,transparent 4.5px) 0 0/22px 26px repeat-x,
   repeating-linear-gradient(to left,transparent 0 8px,var(--wire) 8px 12px,transparent 12px 22px);
  -webkit-mask:linear-gradient(#000 0 100%);border-radius:3px;pointer-events:none}
.head{padding:8px 14px 4px 14px;padding-right:52px;border-bottom:2px solid var(--rule)}
.dateline{display:flex;justify-content:space-between;align-items:center;font-size:.78rem;color:var(--muted);gap:8px;flex-wrap:wrap}
.when{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.day{font-size:1rem;color:var(--ink)}
.day b{color:var(--accent);font-weight:700}
.clock{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.week span{width:18px;height:18px;display:grid;place-items:center;border-radius:50%}
.week .today{border:1.5px solid var(--pink);color:var(--accent);font-weight:700}
h1{font-family:var(--font-hand);font-size:2.9rem;line-height:1;margin:6px 0 2px;text-align:center;font-weight:700;letter-spacing:.02em}
.seg{display:flex;justify-content:center;gap:22px;padding-bottom:6px}
.seg button{border:0;background:none;font-size:1rem;color:var(--muted);padding:4px 2px;border-bottom:3px solid transparent}
.seg button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--pink)}
.seg .c{font-size:.78rem;opacity:.7}

/* ruled lines */
.lines{list-style:none;margin:0;padding:0;background:linear-gradient(to left,transparent 40px,var(--margin) 40px,var(--margin) 41.5px,transparent 41.5px)}
.row{--h:4;display:grid;grid-template-columns:40px 34px minmax(0,1fr) auto 40px;align-items:center;min-height:var(--row);border-bottom:1px solid var(--rule);padding-left:2px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-y;position:relative}
.num{text-align:center;font-family:var(--font-hand);font-size:1.6rem;font-weight:700;color:hsl(var(--h) 72% 48%);line-height:1}
.box{width:22px;height:22px;margin-inline-start:7px;border:2px solid hsl(var(--h) 72% 58%);background:hsl(var(--h) 95% 93%);border-radius:5px;display:grid;place-items:center;padding:0;color:transparent}
.box svg{width:16px;height:16px}
.box:active{color:hsl(var(--h) 72% 45%)}
.txt{padding:8px 4px 8px 8px;line-height:1.35;overflow-wrap:anywhere;font-size:1rem}
.pill{--c:#ecebe6;border:0;background:var(--c);border-radius:999px;padding:4px 10px;font-size:.75rem;white-space:nowrap;max-width:84px;overflow:hidden;text-overflow:ellipsis;display:inline-flex;align-items:center;gap:4px}
.pill::after{content:"⌄";font-size:.7rem;opacity:.55;margin-top:-4px}
.row.blank{cursor:text}
.grip{width:40px;height:44px;border:0;background:none;display:grid;place-items:center;color:#b7ae9c;touch-action:none;cursor:grab;padding:0}
.grip svg{width:20px;height:20px}
.grip:active{color:var(--accent)}
.row.press{background:hsl(var(--h) 95% 96%)}
.row.lifted{position:fixed;z-index:50;background:var(--paper);box-shadow:var(--shadow);border-radius:6px;pointer-events:none;transform:rotate(-1.2deg)}
.row.ph{background:repeating-linear-gradient(-45deg,transparent 0 6px,rgba(233,118,143,.12) 6px 12px)}
.done-view .row .txt{text-decoration:line-through;text-decoration-color:var(--pink);color:var(--muted)}
.done-view .box{border-color:#9ccfa8;background:#e3f4e6;color:#3d9150}
.date{font-size:.72rem;color:var(--muted);white-space:nowrap;text-align:left}
.bk{margin:10px 12px;padding:10px 12px;border-radius:12px;background:#fff4d6;border:1.5px solid #f0d48a;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.88rem}
.bk span{flex:1 1 160px}
.bk button{border:0;border-radius:10px;padding:8px 12px;background:var(--ink);color:var(--paper)}
.bk button.later{background:none;color:var(--muted);text-decoration:underline;padding:8px 4px}
.foot{font-size:.75rem;color:var(--muted);text-align:center;padding:14px 10px 18px}
.emptymsg{color:var(--muted);font-size:.9rem}

/* composer */
.composer{position:fixed;inset:auto 0 0 0;z-index:6;background:var(--paper);border-top:2px solid var(--rule);box-shadow:0 -8px 20px rgba(70,55,30,.1);padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.composer .in{max-width:680px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px}
.crow{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;min-width:0;resize:none;border:1.5px solid var(--rule);background:#fff;color:var(--ink);border-radius:14px;padding:11px 12px;font:inherit;line-height:1.35;max-height:120px}
textarea.live{border-color:var(--accent)}
.clr{flex:none;width:36px;height:48px;border:0;background:none;color:var(--muted);font-size:1.6rem;line-height:1;padding:0}
.mic,.add{flex:none;width:48px;height:48px;border-radius:50%;border:0;display:grid;place-items:center}
.mic{background:#f1ece2}
.mic.on{background:var(--accent);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(217,84,111,.45)}70%{box-shadow:0 0 0 12px rgba(217,84,111,0)}100%{box-shadow:0 0 0 0 rgba(217,84,111,0)}}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none}.tab{transition:none}}
.add{background:var(--ink);color:var(--paper)}
.add:disabled{opacity:.3}
.mic svg,.add svg{width:24px;height:24px}
.suggest{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;font-size:.85rem}
.suggest::-webkit-scrollbar{display:none}
.suggest .lbl{flex:none;color:var(--muted)}
.suggest .q{flex:none;font-weight:700}
.chip{--c:#ecebe6;flex:none;border:1.5px solid transparent;background:var(--c);border-radius:999px;padding:5px 12px;font-size:.88rem;white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--ink);font-weight:700}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(40,30,20,.35);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:680px;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:85vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.sheet h2{font-family:var(--font-hand);font-size:2rem;margin:0;line-height:1}
.sheet textarea,.sheet input[type=text]{width:100%;border:1.5px solid var(--rule);background:#fff;color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1.5px solid #ddd5c6;background:#fff;border-radius:12px;padding:11px 14px}
.btn.primary{background:var(--ink);color:var(--paper);border-color:transparent}
.btn.done{background:#e3f4e6;border-color:#9ccfa8;color:#2f7a42;font-weight:700}
.btn.danger{color:#c0283f;border-color:#e9a2ae}
.btn.danger.armed{background:#c0283f;color:#fff}
.trow{display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--rule);padding-bottom:12px}
.trow .crow{align-items:center}
.small{font-size:.8rem;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--paper);border-radius:12px;padding:10px 14px;display:flex;gap:14px;align-items:center;font-size:.9rem;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline}
.sync{font-size:.7rem;color:var(--muted);text-align:center;padding-top:6px}

/* important dates: a second section on the same page, below the tasks */
.events{border-top:3px double var(--margin);margin-top:4px;padding:10px 0 6px}
.evhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px 6px 12px}
.evhead h2{font-family:var(--font-hand);font-size:1.85rem;line-height:1;margin:0;font-weight:700;white-space:nowrap}
.evbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.evbtn{border:1.5px solid #ddd5c6;background:#fff;border-radius:999px;padding:7px 12px;font-size:.85rem;white-space:nowrap}
.evbtn.primary{background:var(--ink);color:var(--paper);border-color:transparent}
.evlist{list-style:none;margin:0;padding:0}
.ev{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--rule);cursor:pointer;min-height:var(--row)}
.ev:active{background:#faf5ea}
.evd{--b:#f1ece2;--f:var(--ink);background:var(--b);color:var(--f);border-radius:10px;text-align:center;padding:4px 2px 5px;line-height:1}
.evd .dn{display:block;font-family:var(--font-hand);font-size:1.7rem;font-weight:700}
.evd .mn{display:block;font-size:.68rem;margin-top:1px}
.ev.d0 .evd{--b:var(--accent);--f:#fff}
.ev.d1 .evd{--b:#f5a524;--f:#fff}
.ev.wk .evd{--b:#fff0b3}
.evt{overflow-wrap:anywhere;line-height:1.3}
.evs{display:block;font-size:.76rem;color:var(--muted);margin-top:2px}
.evc{font-size:.8rem;color:var(--muted);white-space:nowrap;text-align:left}
.ev.d0 .evc,.ev.d1 .evc{color:var(--accent);font-weight:700}
.ev.past{opacity:.55}
.evmore{display:flex;gap:14px;justify-content:center;padding:8px 12px 2px}
.evmore button{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:.85rem;padding:6px 2px}
.evempty{color:var(--muted);font-size:.9rem;padding:12px}
.sheet input[type=date],.sheet input[type=time]{flex:1;min-width:0;border:1.5px solid var(--rule);background:#fff;color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit;min-height:46px}
.check{display:flex;gap:10px;align-items:center;font-size:.95rem}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.steps{margin:0;padding-inline-start:20px;font-size:.88rem;line-height:1.5}
.steps code{background:#f1ece2;border-radius:6px;padding:1px 5px;font-family:inherit;direction:ltr;unicode-bidi:embed}
details summary{cursor:pointer;font-weight:700;font-size:.92rem}
</style>

<div class="desk">
  <div class="book">
    <nav class="sidetabs" id="sidetabs" aria-label="נושאים"></nav>
    <section class="page" id="page">
      <div class="rings" aria-hidden="true"></div>
      <div class="head">
        <div class="dateline"><div class="when"><div class="day" id="today"></div><div class="clock" id="clock"></div></div></div>
        <h1>המשימות שלי</h1>
        <div class="seg" role="group" aria-label="תצוגה">
          <button id="tabOpen" aria-pressed="true">משימות <span class="c" id="cOpen"></span></button>
          <button id="tabDone" aria-pressed="false">בוצעו <span class="c" id="cDone"></span></button>
        </div>
      </div>
      <div class="bk" id="bkBanner" hidden></div>
      <ul class="lines" id="list"></ul>
      <div class="foot" id="foot"></div>
      <section class="events" id="events" aria-label="תאריכים ופגישות">
        <div class="evhead"><h2>תאריכים ופגישות</h2>
          <div class="evbtns"><button type="button" class="evbtn" id="evSync">⟳ מהיומן</button><button type="button" class="evbtn primary" id="evAdd">+ תאריך</button></div>
        </div>
        <ul class="evlist" id="evList"></ul>
        <div class="evmore" id="evMore"></div>
      </section>
    </section>
  </div>
  <div class="sync" id="sync">נשמר במכשיר</div>
</div>

<div class="composer" id="composer">
  <div class="in">
    <div class="suggest" id="suggest" hidden></div>
    <form class="crow" id="form">
      <button type="button" class="clr" id="clr" aria-label="נקה את הטקסט" hidden>×</button>
      <textarea id="input" rows="1" placeholder="משימה חדשה…" aria-label="משימה חדשה"></textarea>
      <button type="button" class="mic" id="mic" aria-label="הקלטה קולית" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <button type="submit" class="add" id="add" aria-label="הוסף משימה" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </form>
  </div>
</div>

<div id="sheetHost"></div>
<div id="toastHost"></div>

<script>
(function(){
"use strict";
const LS_KEY = "todo-he-v1";
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const PASTELS = ["#ecebe6","#d8ecff","#ffd9de","#fff0b3","#d9f2da","#eadcff","#ffe1c4","#d2f1ee","#f6d9f0"];

const DEFAULT_TOPICS = [
  {id:"general", name:"כללי", kw:[]},
  {id:"music", name:"מוזיקה", kw:["מוזיקה","שיר","אלבום","הופעה","גיטרה","פסנתר","תופים","הקלטה","אולפן","סינגל","מיקס","מאסטר","להקה","חזרה","קליפ","ספוטיפיי","לחן","מילים","מיתרים"]},
  {id:"gallery", name:"גלריה", kw:["גלריה","תערוכה","ציור","ציורים","אמן","אמנית","אמנים","יצירה","יצירות","קנבס","מסגרת","מסגור","אוצר","אוצרת","פתיחה","סדנה","השכרה"]}
];

let S = load() || {v:1, topics: DEFAULT_TOPICS.map(t=>({...t, kw:[...t.kw]})), tasks: [], events: []};
let view = {tab:"open", topic:"all"};
let pendingTopic = null, detected = null;

function normalize(d){
  if(!d || !Array.isArray(d.tasks) || !Array.isArray(d.topics)) return null;
  const topics = d.topics.filter(t=>t && t.id && t.name).map(t=>({id:String(t.id), name:String(t.name), kw:Array.isArray(t.kw)?t.kw.map(String):[]}));
  if(!topics.some(t=>t.id==="general")) topics.unshift({id:"general",name:"כללי",kw:[]});
  const ids = new Set(topics.map(t=>t.id));
  const tasks = d.tasks.filter(t=>t && t.id && typeof t.text==="string").map(t=>({id:String(t.id), text:t.text, topic: ids.has(t.topic)?t.topic:"general", created:+t.created||Date.now(), doneAt: t.doneAt?+t.doneAt:null}));
  const events = (Array.isArray(d.events)?d.events:[]).filter(e=>e && e.id && typeof e.title==="string" && /^\d{4}-\d{2}-\d{2}$/.test(e.date))
    .map(e=>({id:String(e.id), title:e.title, date:e.date, time:/^\d{2}:\d{2}$/.test(e.time)?e.time:"", note:typeof e.note==="string"?e.note:"", src:e.src==="cal"?"cal":"app"}));
  return {v:1, topics, tasks, events};
}
function load(){ try{ return normalize(JSON.parse(localStorage.getItem(LS_KEY))); }catch(e){ return null; } }
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }

/* ---------- cloud sync (claude.ai) ---------- */
let ref = null, dirty = false, saving = false, saveTimer = null, seeded = false;
function commit(){ saveLocal(); dirty = true; render(); scheduleSave(); }
function scheduleSave(){ if(!ref) return; clearTimeout(saveTimer); saveTimer = setTimeout(flush, 500); }
async function flush(){
  if(!ref || saving || !dirty) return;
  saving = true; dirty = false; setSync("שומר…");
  try{ await ref.set(JSON.parse(JSON.stringify(S))); setSync("נשמר ✓"); }
  catch(e){ dirty = true; setSync("לא נשמר בענן, נשמר במכשיר"); }
  saving = false;
  if(dirty) scheduleSave();
}
function setSync(t){ $("#sync").textContent = t; }
async function initCloud(){
  if(!window.claude || !claude.use) return;
  try{
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if(!db || !user) return;
    const id = await user.id();
    if(!id) return;
    ref = db.doc("data/users/" + id + "/todo");
    setSync("מתחבר…");
    const t = setTimeout(()=>setSync("אין חיבור כרגע, נשמר במכשיר"), 10000);
    ref.onSnapshot(snap=>{
      const cached = snap.metadata && snap.metadata.fromCache;
      if(!cached) clearTimeout(t);
      if(snap.exists){
        if(dirty || saving || (snap.metadata && snap.metadata.hasPendingWrites)) return;
        const d = normalize(snap.data());
        if(d && JSON.stringify(d) !== JSON.stringify(S)){ S = d; saveLocal(); if(!press) render(); }
        setSync("מסונכרן ✓");
      } else if(!cached && !seeded){
        seeded = true; dirty = true; flush();
      }
    }, ()=>{ clearTimeout(t); ref = null; setSync("נשמר במכשיר"); });
  }catch(e){}
}

/* ---------- helpers ---------- */
const topicById = id => S.topics.find(t=>t.id===id) || S.topics[0];
const topicColor = id => { const i = S.topics.findIndex(t=>t.id===id); return PASTELS[(i<0?0:i) % PASTELS.length]; };
const openTasks = () => S.tasks.filter(t=>!t.doneAt);
const doneTasks = () => S.tasks.filter(t=>t.doneAt).sort((a,b)=>b.doneAt-a.doneAt);
const visibleOpen = () => openTasks().filter(t=> view.topic==="all" || t.topic===view.topic);
const visibleDone = () => doneTasks().filter(t=> view.topic==="all" || t.topic===view.topic);
function hueFor(i,n){ return n<=1 ? 4 : Math.round(4 + (205-4) * i/(n-1)); }
function fmtShort(ts){
  const d = new Date(ts), now = new Date();
  const time = d.toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"});
  const same = (a,b)=>a.toDateString()===b.toDateString();
  const y = new Date(now); y.setDate(now.getDate()-1);
  if(same(d,now)) return "היום " + time;
  if(same(d,y)) return "אתמול " + time;
  return d.toLocaleDateString("he-IL",{day:"numeric",month:"numeric",year:"2-digit"});
}
function fmtLong(ts){ const d = new Date(ts); return d.toLocaleDateString("he-IL",{weekday:"long",day:"numeric",month:"long",year:"numeric"}) + ", " + d.toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"}); }
function applyVisibleOrder(newVisible){
  const set = new Set(newVisible.map(t=>t.id)); let k = 0;
  S.tasks = S.tasks.map(t => set.has(t.id) ? newVisible[k++] : t);
}
function moveTo(task, where){
  const vis = visibleOpen();
  if(!vis.includes(task)){ S.tasks = S.tasks.filter(t=>t!==task); where==="top" ? S.tasks.unshift(task) : S.tasks.push(task); return; }
  const rest = vis.filter(t=>t!==task);
  applyVisibleOrder(where==="top" ? [task, ...rest] : [...rest, task]);
}

/* ---------- topic detection ---------- */
const PREFIX = /^[והבלמשכ]/;
function variants(w){ const out = new Set([w]); let x = w; for(let i=0;i<2 && x.length>2 && PREFIX.test(x);i++){ x = x.slice(1); out.add(x); } return [...out]; }
function cleanWord(w){ return w.replace(/[^֐-׿a-zA-Z0-9]/g,""); }
function matchesWord(v, kw){ kw = kw.trim(); if(!kw) return false; return v===kw || v===kw+"ים" || v===kw+"ות" || v===kw+"ה" || v===kw+"י" || (kw.endsWith("ה") && v===kw.slice(0,-1)+"ות"); }
const tidy = s => s.replace(/\s+/g," ").replace(/^[\s,.\-]+|[\s,\-]+$/g,"").trim();
function detect(text){
  const clean = text.trim();
  const res = {clean, topicId:null, newName:null, candidates:[]};
  if(!clean) return res;
  const m = clean.match(/(^|[\s,.])([ובל]?נושא|קטגוריה)\s*[:\-]?\s*/);
  if(m){
    const start = m.index + m[1].length, after = clean.slice(m.index + m[0].length);
    const sorted = [...S.topics].sort((a,b)=>b.name.length-a.name.length);
    for(const t of sorted) for(const p of ["","ה"]){
      const nm = p + t.name;
      if(after.startsWith(nm) && (after.length===nm.length || /[\s,.!?]/.test(after[nm.length]))){
        res.topicId = t.id; res.clean = tidy(clean.slice(0,start) + " " + after.slice(nm.length)); return res;
      }
    }
    const w = after.match(/^[^\s,.!?]+/);
    if(w){ res.newName = w[0].replace(/^ה(?=..)/,""); res.clean = tidy(clean.slice(0,start) + " " + after.slice(w[0].length)); return res; }
  }
  const words = clean.split(/\s+/).map(cleanWord).filter(Boolean);
  const scores = [];
  for(const t of S.topics){
    if(t.id==="general") continue;
    const kws = [t.name, ...(t.kw||[])]; let s = 0;
    for(const w of words){ const vs = variants(w); if(kws.some(k=>vs.some(v=>matchesWord(v,k)))) s++; }
    if(s) scores.push({id:t.id, s});
  }
  scores.sort((a,b)=>b.s-a.s);
  if(scores.length===1 || (scores.length>1 && scores[0].s>scores[1].s)) res.topicId = scores[0].id;
  else if(scores.length>1) res.candidates = scores.filter(x=>x.s===scores[0].s).map(x=>x.id);
  return res;
}

/* ---------- rendering ---------- */
const ICON_GRIP = `<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.8"/><circle cx="15" cy="6" r="1.8"/><circle cx="9" cy="12" r="1.8"/><circle cx="15" cy="12" r="1.8"/><circle cx="9" cy="18" r="1.8"/><circle cx="15" cy="18" r="1.8"/></svg>`;
const ICON_CHECK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;
function renderHead(){
  const d = new Date();
  renderClock();
  $("#tabOpen").setAttribute("aria-pressed", view.tab==="open");
  $("#tabDone").setAttribute("aria-pressed", view.tab==="done");
  $("#cOpen").textContent = openTasks().length ? `(${openTasks().length})` : "";
  $("#cDone").textContent = doneTasks().length ? `(${doneTasks().length})` : "";
}
const DAYS = ["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];
function renderClock(){
  const d = new Date();
  $("#today").innerHTML = `יום <b>${DAYS[d.getDay()]}</b> · ${d.getDate()}/${d.getMonth()+1}`;
  $("#clock").textContent = String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}
setInterval(renderClock, 15000);
function renderTabs(){
  const src = view.tab==="open" ? openTasks() : doneTasks();
  const counts = {}; src.forEach(t=>counts[t.topic]=(counts[t.topic]||0)+1);
  let h = `<button class="tab" style="--c:#f3efe6" data-filter="all" aria-pressed="${view.topic==="all"}">הכל<span class="n">${src.length}</span></button>`;
  for(const t of S.topics) h += `<button class="tab" style="--c:${topicColor(t.id)}" data-filter="${esc(t.id)}" data-topic="${esc(t.id)}" aria-pressed="${view.topic===t.id}">${esc(t.name)}<span class="n">${counts[t.id]||0}</span></button>`;
  h += `<button class="tab tool" id="newTopic" aria-label="נושא חדש">+</button><button class="tab tool" id="manage" aria-label="עריכת נושאים">✎</button>`;
  $("#sidetabs").innerHTML = h;
}
function pill(t){ return `<button class="pill" data-topicpick style="--c:${topicColor(t.topic)}" aria-label="החלף נושא">${esc(topicById(t.topic).name)}</button>`; }
function blanks(n, msg){
  let h = "";
  for(let i=0;i<n;i++) h += `<li class="row blank" data-blank><span></span><span></span><span></span><span class="txt ${i===0&&msg?"emptymsg":""}">${i===0&&msg?msg:""}</span><span></span></li>`;
  return h;
}
function renderList(){
  const list = $("#list");
  $("#page").classList.toggle("done-view", view.tab==="done");
  if(view.tab==="open"){
    const vis = visibleOpen(), n = vis.length;
    const rows = vis.map((t,i)=>`
      <li class="row" data-id="${esc(t.id)}" style="--h:${hueFor(i,n)}">
        <span class="num">${i+1}</span>
        <button class="box" data-check aria-label="סמן כבוצע">${ICON_CHECK}</button>
        <span class="txt">${esc(t.text)}</span>
        ${pill(t)}
        <button class="grip" data-handle aria-label="גרור כדי להזיז">${ICON_GRIP}</button>
      </li>`).join("");
    const tn = view.topic==="all" ? "" : ` ב"${esc(topicById(view.topic).name)}"`;
    list.innerHTML = rows + blanks(Math.max(2, 6-n), n ? "" : `אין משימות פתוחות${tn}. כתוב או הקלט משימה למטה.`);
    $("#foot").textContent = n>1 ? "גרור את ⋮⋮ באצבע כדי לשנות סדר, או אל לשונית של נושא. לחיצה ארוכה על משימה: בוצע ועריכה." : (n ? "לחיצה ארוכה על משימה פותחת אפשרויות." : "");
  } else {
    const vis = visibleDone();
    const rows = vis.map(t=>`
      <li class="row" data-id="${esc(t.id)}">
        <span></span>
        <span class="box">${ICON_CHECK}</span>
        <span class="txt">${esc(t.text)}</span>
        <span class="date">${esc(fmtShort(t.doneAt))}</span>
        <span></span>
      </li>`).join("");
    list.innerHTML = rows + blanks(Math.max(2, 6-vis.length), vis.length ? "" : "עוד לא בוצעו משימות כאן.");
    $("#foot").textContent = vis.length ? "לחיצה על משימה: להחזיר אותה לרשימה או למחוק." : "";
  }
}
function render(){ if(typeof renderBackupBanner==="function") try{ renderBackupBanner(); }catch(e){} renderHead(); renderTabs(); renderList(); renderEvents(); renderSuggest(); $("#composer").hidden = view.tab==="done"; }

/* ---------- composer ---------- */
const input = $("#input");
function autosize(){ input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 120) + "px"; }
function onTextChange(){
  autosize();
  $("#add").disabled = !input.value.trim();
  $("#clr").hidden = !input.value;
  const d = detect(input.value);
  const changed = !detected || detected.topicId!==d.topicId || detected.newName!==d.newName || detected.candidates.join()!==d.candidates.join();
  detected = d;
  if(changed){
    if(d.topicId) pendingTopic = {kind:"id", id:d.topicId};
    else if(d.newName) pendingTopic = {kind:"new", name:d.newName};
    else if(d.candidates.length) pendingTopic = null;
    else if(!pendingTopic || pendingTopic.auto) pendingTopic = {kind:"id", id: view.topic!=="all" ? view.topic : "general", auto:true};
  }
  renderSuggest();
}
function renderSuggest(){
  const box = $("#suggest");
  if(!input.value.trim() || view.tab!=="open"){ box.hidden = true; return; }
  box.hidden = false;
  let h = "";
  if(detected && detected.candidates.length && !pendingTopic){
    h += `<span class="q">לאיזה נושא?</span>`;
    for(const id of detected.candidates) h += `<button type="button" class="chip" style="--c:${topicColor(id)}" data-pick="${esc(id)}">${esc(topicById(id).name)}</button>`;
    h += `<button type="button" class="chip" data-pick="general">כללי</button>`;
  } else {
    h += `<span class="lbl">נושא:</span>`;
    if(pendingTopic && pendingTopic.kind==="new") h += `<button type="button" class="chip" aria-pressed="true" data-pick="__new">+ חדש: ${esc(pendingTopic.name)}</button>`;
    for(const t of S.topics){
      const on = pendingTopic && pendingTopic.kind==="id" && pendingTopic.id===t.id;
      h += `<button type="button" class="chip" style="--c:${topicColor(t.id)}" aria-pressed="${!!on}" data-pick="${esc(t.id)}">${esc(t.name)}</button>`;
    }
  }
  box.innerHTML = h;
}
$("#suggest").addEventListener("click", e=>{
  const b = e.target.closest("[data-pick]"); if(!b || b.dataset.pick==="__new") return;
  pendingTopic = {kind:"id", id:b.dataset.pick}; renderSuggest();
});
input.addEventListener("input", onTextChange);
$("#clr").addEventListener("click", ()=>{ if(listening) stopListening(); clearInput(); input.focus(); });
input.addEventListener("keydown", e=>{ if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); addTask(); } });
$("#form").addEventListener("submit", e=>{ e.preventDefault(); addTask(); });

function addTask(){
  if(listening) stopListening();
  const raw = input.value.trim(); if(!raw) return;
  const d = detect(raw);
  const text = (d.topicId || d.newName) ? (d.clean || raw) : raw;
  let topic = "general";
  if(pendingTopic && pendingTopic.kind==="new"){
    const ex = S.topics.find(t=>t.name===pendingTopic.name);
    if(ex) topic = ex.id; else { const t = {id:uid(), name:pendingTopic.name, kw:[]}; S.topics.push(t); topic = t.id; }
  } else if(pendingTopic) topic = pendingTopic.id;
  const task = {id:uid(), text, topic, created:Date.now(), doneAt:null};
  S.tasks.push(task); // new tasks go to the bottom; drag them up if urgent
  clearInput();
  commit();
  toast(`נוסף ל"${topicById(topic).name}"`);
  const el = document.querySelector(`.row[data-id="${task.id}"]`); if(el) el.scrollIntoView({block:"nearest", behavior:"smooth"});
}

/* ---------- voice ---------- */
let dict = null, rec = null, listening = false, finalText = "", baseText = "", voiceLive = false;
function clearInput(){
  // stop any voice session from writing old words back into the box
  voiceLive = false; finalText = ""; baseText = "";
  if(rec) killRec(); else if(dict && listening) dict.stop().catch(()=>{});
  input.value = ""; pendingTopic = null; detected = null; onTextChange();
}
const mic = $("#mic");
function setMic(on){ listening = on; mic.classList.toggle("on", on); input.classList.toggle("live", on); mic.setAttribute("aria-label", on ? "עצור הקלטה" : "הקלטה קולית"); }
function showLive(partial){ if(!voiceLive) return; input.value = (baseText + finalText + (partial ? " " + partial : "")).replace(/\s+/g," ").trimStart(); onTextChange(); }
function killRec(){
  if(!rec) return;
  const r = rec; rec = null;
  r.onresult = r.onend = r.onerror = null;
  try{ r.abort(); }catch(e){}
  setMic(false);
}
function startWebSpeech(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  killRec();
  try{
    const r = new SR(); rec = r; r.lang = "he-IL"; r.interimResults = true; r.continuous = true;
    // rebuild the whole transcript of THIS session each time (iOS can resend old results)
    r.onresult = ev=>{
      if(rec!==r) return;
      let fin = "", interim = "";
      for(let i=0;i<ev.results.length;i++){ const x = ev.results[i]; if(x.isFinal) fin += " " + x[0].transcript; else interim += " " + x[0].transcript; }
      finalText = fin; showLive(interim.trim());
    };
    r.onerror = ev=>{ if(ev.error==="not-allowed"||ev.error==="service-not-allowed") toast("אין גישה למיקרופון. אפשר להקליד, או להשתמש במיקרופון של המקלדת."); };
    r.onend = ()=>{ if(rec!==r) return; rec = null; setMic(false); showLive(""); voiceLive = false; };
    r.start(); setMic(true);
  }catch(e){ rec = null; setMic(false); toast("ההקלטה לא זמינה כאן. אפשר להשתמש במיקרופון של המקלדת."); }
}
function startListening(){
  baseText = input.value.trim() ? input.value.trim() + " " : ""; finalText = ""; voiceLive = true;
  if(dict){
    dict.start({language:"he"}).catch(err=>{
      setMic(false); const c = err && err.code;
      if(c==="not_granted") toast("לא ניתנה גישה למיקרופון. אפשר להקליד, או להשתמש במיקרופון של המקלדת.");
      else if(c!=="stopped" && c!=="dismissed") toast("ההקלטה לא הצליחה, נסה שוב.");
    });
  } else startWebSpeech();
}
function stopListening(){ if(dict) dict.stop().catch(()=>{}); else if(rec) try{ rec.stop(); }catch(e){} }
mic.addEventListener("click", ()=>{ listening ? stopListening() : startListening(); });
async function initVoice(){
  if(window.claude && claude.use){
    try{
      const d = await claude.use("dictation");
      if(d){
        dict = d; mic.hidden = false;
        d.onPartial(({text})=>showLive(text));
        d.onFinal(({text})=>{ finalText += text; showLive(""); });
        d.onState(({state})=>{ setMic(state!=="idle"); if(state==="idle"){ showLive(""); voiceLive = false; } });
        return;
      }
    }catch(e){}
  }
  if(window.SpeechRecognition || window.webkitSpeechRecognition) mic.hidden = false;
}

/* ---------- press / long-press / drag ---------- */
const list = $("#list");
let press = null; // {li,id,x,y,pid,timer,lifted,moved,ph,dy,over,lastY}
const LONG = 420;
list.addEventListener("contextmenu", e=>e.preventDefault());
list.addEventListener("click", e=>{
  if(e.target.closest("[data-blank]") && view.tab==="open"){ input.focus(); return; }
  const li = e.target.closest(".row[data-id]"); if(!li) return;
  const task = S.tasks.find(t=>t.id===li.dataset.id); if(!task) return;
  if(e.target.closest("[data-check]")){ markDone(task); return; }
  if(e.target.closest("[data-topicpick]")){ openTopicPicker(task); return; }
  if(suppressClick){ suppressClick = false; return; }
  openMenu(task);
});
let suppressClick = false;
list.addEventListener("pointerdown", e=>{
  const li = e.target.closest(".row[data-id]");
  if(!li || e.button>0 || e.target.closest("[data-check],[data-topicpick]")) return;
  press = {handle:!!e.target.closest("[data-handle]"), li, id:li.dataset.id, x:e.clientX, y:e.clientY, lastY:e.clientY, pid:e.pointerId, lifted:false, moved:false, over:null};
  li.classList.add("press");
  if(e.target.closest("[data-handle]") && view.tab==="open"){ e.preventDefault(); lift(); return; }
  press.timer = setTimeout(()=>{ if(press && press.li===li) lift(); }, LONG);
});
function lift(){
  const {li} = press;
  li.classList.remove("press");
  if(navigator.vibrate) try{ navigator.vibrate(20); }catch(_){}
  press.lifted = true;
  if(view.tab!=="open") return; // done list: long-press just opens the menu on release
  const r = li.getBoundingClientRect();
  const ph = document.createElement("li"); ph.className = "row ph"; ph.style.height = r.height + "px";
  li.after(ph); press.ph = ph; press.dy = press.y - r.top;
  li.classList.add("lifted");
  Object.assign(li.style, {width:r.width+"px", left:r.left+"px", top:r.top+"px"});
  scrollLoop();
}
window.addEventListener("touchmove", e=>{ if(press && press.lifted) e.preventDefault(); }, {passive:false});
window.addEventListener("pointermove", e=>{
  if(!press || e.pointerId!==press.pid) return;
  const dx = e.clientX - press.x, dy = e.clientY - press.y;
  if(!press.lifted){
    if(Math.hypot(dx,dy) > 10){ clearTimeout(press.timer); press.li.classList.remove("press"); press = null; }
    return;
  }
  if(!press.ph) return;
  e.preventDefault();
  if(Math.hypot(dx,dy) > 6) press.moved = true;
  press.lastY = e.clientY;
  press.li.style.top = (e.clientY - press.dy) + "px";
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const tab = el && el.closest && el.closest(".tab[data-topic]");
  if(press.over && press.over!==tab) press.over.classList.remove("drop");
  press.over = tab || null;
  if(tab){ tab.classList.add("drop"); return; }
  const items = [...list.querySelectorAll(".row[data-id]:not(.lifted)")];
  let before = null;
  for(const it of items){ const rr = it.getBoundingClientRect(); if(e.clientY < rr.top + rr.height/2){ before = it; break; } }
  if(!before) before = list.querySelector(".row.blank");
  if(before && press.ph.nextSibling!==before) list.insertBefore(press.ph, before);
}, {passive:false});
function scrollLoop(){
  if(!press || !press.lifted) return;
  const y = press.lastY, comp = $("#composer").getBoundingClientRect().top;
  if(!press.over){ if(y < 70) window.scrollBy(0,-8); else if(y > comp - 40) window.scrollBy(0,8); }
  requestAnimationFrame(scrollLoop);
}
function endPress(e, cancelled){
  if(!press || (e && e.pointerId!==press.pid)) return;
  const p = press; press = null;
  clearTimeout(p.timer); p.li.classList.remove("press");
  if(!p.lifted) return; // a short tap: the click handler opens the menu
  suppressClick = true; setTimeout(()=>{ suppressClick = false; }, 400);
  const task = S.tasks.find(t=>t.id===p.id);
  if(!p.ph){ if(!cancelled && task) openMenu(task); return; }
  if(p.over) p.over.classList.remove("drop");
  if(!p.moved || cancelled){ render(); if(!cancelled && task && !p.handle) openMenu(task); return; }
  if(p.over && task){
    const tid = p.over.dataset.topic;
    if(task.topic!==tid){ task.topic = tid; commit(); toast(`הועבר ל"${topicById(tid).name}"`); } else render();
    return;
  }
  const order = [...list.children].filter(n=>n!==p.li).map(n=> n===p.ph ? p.id : n.dataset.id).filter(Boolean);
  const map = new Map(S.tasks.map(t=>[t.id,t]));
  const newVis = order.map(x=>map.get(x)).filter(Boolean);
  if(newVis.length === visibleOpen().length) applyVisibleOrder(newVis);
  commit();
}
window.addEventListener("pointerup", e=>endPress(e,false));
window.addEventListener("pointercancel", e=>endPress(e,true));

/* ---------- actions ---------- */
function markDone(task){ task.doneAt = Date.now(); commit(); toast("סומן כבוצע ✓", "בטל", ()=>{ task.doneAt = null; commit(); }); }

$("#tabOpen").addEventListener("click", ()=>{ view.tab="open"; render(); });
$("#tabDone").addEventListener("click", ()=>{ view.tab="done"; render(); });
$("#sidetabs").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.id==="newTopic") return openNewTopic();
  if(b.id==="manage") return openManage();
  if(b.dataset.filter){ view.topic = b.dataset.filter; render(); }
});

function sheet(html, onReady){
  $("#sheetHost").innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const scrim = $("#scrim");
  scrim.addEventListener("click", e=>{ if(e.target===scrim) closeSheet(); });
  onReady && onReady(scrim.firstElementChild);
}
function closeSheet(){ $("#sheetHost").innerHTML = ""; }
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeSheet(); });
function topicChips(sel){ return S.topics.map(t=>`<button type="button" class="chip" style="--c:${topicColor(t.id)}" data-t="${esc(t.id)}" aria-pressed="${t.id===sel}">${esc(t.name)}</button>`).join(""); }
function armDanger(b, label, fn){
  if(b.classList.contains("armed")) return fn();
  b.classList.add("armed"); b.textContent = "בטוח? לחץ שוב";
  setTimeout(()=>{ if(b.isConnected){ b.classList.remove("armed"); b.textContent = label; } }, 3000);
}

function openMenu(task){
  if(task.doneAt){
    sheet(`<h2>משימה שבוצעה</h2>

async function backupSave(){

  const blob = new Blob([JSON.stringify(S, null, 1)], {type:"application/json"});
  try{
    const file = new File([blob], name, {type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:"גיבוי משימות"}); markBackedUp(); return; }
  }catch(e){ if(e && e.name==="AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  markBackedUp();
}
const BK_KEY = "todo-he-backup";

const pad2 = n => String(n).padStart(2,"0");
const dstr = d => d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate());
const pdate = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const todayStr = () => dstr(new Date());
const daysUntil = s => Math.round((pdate(s) - pdate(todayStr())) / DAY);

function countdown(s, time){
  const n = daysUntil(s);
  if(n===0) return time ? "היום " + time : "היום";
  if(n===1) return time ? "מחר " + time : "מחר";
  if(n===2) return "מחרתיים";
  if(n<0) return n===-1 ? "אתמול" : `לפני ${-n} ימים`;
  if(n<7) return `בעוד ${n} ימים`;
  if(n<14) return n===7 ? "בעוד שבוע" : `בעוד ${n} ימים`;
  if(n<31) return `בעוד ${Math.round(n/7)} שבועות`;

/* app -> iPhone: a standard .ics file, which iOS opens with "Add to Calendar" */
function icsText(e){
  const esc2 = s => String(s).replace(/\\/g,"\\\\").replace(/;/g,"\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");
  const ymd = e.date.replace(/-/g,"");
  let start, end;
  if(e.time){
    const s = pdate(e.date); const [hh,mm] = e.time.split(":").map(Number); s.setHours(hh, mm);
    const f = d => dstr(d).replace(/-/g,"") + "T" + pad2(d.getHours()) + pad2(d.getMinutes()) + "00";
    start = "DTSTART:" + f(s); end = "DTEND:" + f(new Date(s.getTime() + 36e5));
  } else {
    const n = pdate(e.date); n.setDate(n.getDate()+1);
    start = "DTSTART;VALUE=DATE:" + ymd; end = "DTEND;VALUE=DATE:" + dstr(n).replace(/-/g,"");
  }
  const stamp = new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//tasks//he","CALSCALE:GREGORIAN","METHOD:PUBLISH","BEGIN:VEVENT",
    "UID:" + e.id + "@tasks", "DTSTAMP:" + stamp, start, end, "SUMMARY:" + esc2(e.title),
    e.note ? "DESCRIPTION:" + esc2(e.note) : null, "END:VEVENT","END:VCALENDAR"].filter(Boolean).join("\r\n") + "\r\n";
}
function addToPhoneCalendar(e){
  const ics = icsText(e);
  const iOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
  if(iOS){
    // iOS shows its own "Add to Calendar" screen for a calendar data link
    const url = "data:text/calendar;charset=utf-8," + encodeURIComponent(ics);
    toast("נפתח היומן. לחץ שם \"הוסף ליומן\"");
    const w = window.open(url, "_blank"); if(!w) location.href = url;
    return;
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([ics], {type:"text/calendar"}));
  a.download = e.title.replace(/[\\/:*?"<>|]/g,"").slice(0,40) + ".ics";
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast("קובץ יומן ירד. פתח אותו כדי להוסיף ליומן");
}

/* iPhone -> app: a Shortcut copies upcoming events as text lines "title | yyyy-MM-dd HH:mm"; the app pastes them */
function parseCal(text){
  const out = [];
  for(const raw of String(text).split(/\r?\n/)){
    const line = raw.trim(); if(!line) continue;
    let m = line.match(/(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T,]+(\d{1,2}):(\d{2}))?/), y, mo, d, hh, mm;
    if(m){ [, y, mo, d, hh, mm] = m; }
    else { m = line.match(/(\d{1,2})[./](\d{1,2})[./](\d{2,4})(?:[ ,]+(\d{1,2}):(\d{2}))?/); if(!m) continue; [, d, mo, y, hh, mm] = m; if(y.length===2) y = "20" + y; }
    const date = `${y}-${pad2(mo)}-${pad2(d)}`;
    let time = hh!=null ? pad2(hh) + ":" + mm : "";
    if(time==="00:00") time = "";
    const title = line.slice(0, m.index).replace(/[|\t,\-–:\s]+$/,"").trim() || line.slice(m.index + m[0].length).replace(/^[|\t,\-–:\s]+/,"").trim();
    if(title && !isNaN(pdate(date))) out.push({title, date, time});
  }
  return out;
}
function importCal(text){
  const items = parseCal(text);
  if(!items.length){ toast("לא מצאתי אירועים בטקסט שהודבק"); return false; }
  S.events = S.events || [];
  const have = new Set(S.events.map(evKey)), got = new Set(items.map(evKey));
  let added = 0, removed = 0;
  for(const it of items){ const k = evKey(it); if(!have.has(k)){ S.events.push({id:uid(), ...it, note:"", src:"cal"}); have.add(k); added++; } }
  // calendar events that disappeared from the iPhone (deleted or moved) inside the imported range are removed here too
  const t = todayStr(), last = items.map(i=>i.date).sort().pop();
  S.events = S.events.filter(e=>{ const gone = e.src==="cal" && e.date>t && e.date<=last && !got.has(evKey(e)); if(gone) removed++; return !gone; });
  closeSheet(); commit();
  toast(added||removed ? `מהיומן: ${added} נוספו${removed ? `, ${removed} הוסרו` : ""}` : "הכל כבר מעודכן ✓");
  return true;
}
function openCalSync(){
  sheet(`<h2>מהיומן של האייפון</h2>
    <div class="small">אפליקציה מהאתר לא יכולה לקרוא את היומן של אפל לבד. לכן קיצור דרך באייפון מעתיק את האירועים הקרובים, ואז מדביקים כאן. אירוע שכבר קיים לא ייכנס פעמיים.</div>
    <div class="btns"><button class="btn" id="csRun">1. הרץ את הקיצור</button><button class="btn primary" id="csPaste">2. הדבק מהיומן</button></div>
    <textarea id="csText" rows="4" placeholder="אפשר גם להדביק כאן ידנית, שורה לכל אירוע: פגישה עם דני | 2026-12-03 14:30" aria-label="טקסט מהיומן" hidden></textarea>
    <div class="btns" id="csManual" hidden><button class="btn primary" id="csImport">ייבא</button></div>
    <details><summary>איך מכינים את הקיצור (פעם אחת, כ-3 דקות)</summary>
      <ol class="steps">
        <li>פתח את אפליקציית <b>קיצורים</b> (Shortcuts) ← <b>+</b> קיצור חדש. קרא לו בדיוק: <code>${SHORTCUT_NAME}</code></li>
        <li>הוסף פעולה <b>חפש אירועים ביומן</b> (Find Calendar Events). הגדר: "תאריך התחלה" ← "ב-הבא" ← <b>60 ימים</b>. מיון לפי תאריך התחלה.</li>
        <li>הוסף <b>חזור עם כל פריט</b> (Repeat with Each). בתוכו פעולת <b>מלל</b> (Text) וכתוב: <code>כותרת | תאריך התחלה</code>, כש"כותרת" ו"תאריך התחלה" הם משתנים של "פריט חוזר". לחץ על "תאריך התחלה" ← עיצוב מותאם: <code>yyyy-MM-dd HH:mm</code></li>
        <li>אחרי הלולאה: <b>צרף מלל</b> (Combine Text) עם <b>שורה חדשה</b>, ואז <b>העתק ללוח</b> (Copy to Clipboard).</li>
        <li>זהו. מעכשיו: "⟳ מהיומן" ← "1. הרץ" ← חוזרים לכאן ← "2. הדבק".</li>
      </ol></details>
    <div class="btns"><button class="btn" id="csClose">סגור</button></div>`, root=>{
      const $r = s => root.querySelector(s);
      const manual = ()=>{ $r("#csText").hidden = false; $r("#csManual").hidden = false; $r("#csText").focus(); };
      $r("#csRun").onclick = ()=>{ location.href = "shortcuts://run-shortcut?name=" + encodeURIComponent(SHORTCUT_NAME); };
      $r("#csPaste").onclick = async ()=>{
        try{ const t = await navigator.clipboard.readText(); if(t && importCal(t)) return; if(!t) toast("הלוח ריק. הרץ קודם את הקיצור"); }
        catch(e){ toast("לא הצלחתי לקרוא את הלוח. הדבק בתיבה"); }
        manual();
      };
      $r("#csImport").onclick = ()=>importCal($r("#csText").value);
      $r("#csClose").onclick = closeSheet;
    });
}

let toastTimer = null;
function toast(msg, action, fn){
  const host = $("#toastHost");
  host.innerHTML = `<div class="toast" role="status"><span></span>${action ? `<button type="button"></button>` : ""}</div>`;
  host.querySelector("span").textContent = msg;
  if(action){ const b = host.querySelector("button"); b.textContent = action; b.onclick = ()=>{ host.innerHTML=""; fn(); }; }
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ host.innerHTML = ""; }, action ? 5000 : 2200);
}

render();
initVoice();
initCloud();
})();
</script>

<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script>
</body>
</html>
